<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedrun Split Tracker & Telemetry</title>
    <style>
        :root {
            --bg: #0e1117;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --gold: #f1e05a;
            --green: #2ea043;
            --text: #c9d1d9;
            --border: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 24px; }
        .container { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        h1 { font-size: 1.5rem; color: #fff; display: flex; align-items: center; gap: 8px; }
        .category-select { background: var(--card-bg); color: #fff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; font-size: 0.95rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 18px; }
        .card h2 { font-size: 1.15rem; margin-bottom: 14px; color: #fff; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: #8b949e; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
        .time-badge { font-family: monospace; font-size: 0.95rem; font-weight: 600; color: var(--gold); }
        .best-badge { color: var(--green); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px 10px; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; color: #fff; }
        button { background: var(--green); color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Speedrun Split & Telemetry Tracker</h1>
            <div>
                <label>Category:</label>
                <select id="categorySelect" class="category-select" onchange="loadAllData()">
                    <option value="70 Star" selected>Super Mario 64 - 70 Star</option>
                    <option value="16 Star">Super Mario 64 - 16 Star</option>
                    <option value="120 Star">Super Mario 64 - 120 Star</option>
                </select>
            </div>
        </header>

        <div class="grid">
            <!-- Overall Leaderboard -->
            <div class="card">
                <h2>🏆 Category Leaderboard</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Runner</th>
                            <th>Stars</th>
                            <th>Total Time</th>
                            <th>Best Star</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody"></tbody>
                </table>
            </div>

            <!-- Update Best Time Form -->
            <div class="card">
                <h2>⏱️ Update / Log Star Split (PB)</h2>
                <form id="timeForm" onsubmit="handleUpdateTime(event)">
                    <div class="form-group">
                        <label>Runner Tag</label>
                        <input type="text" id="runnerTag" value="CosmicMario" required />
                    </div>
                    <div class="form-group">
                        <label>Star Mission (All 120 SM64 Stars)</label>
                        <select id="starSelect">
                            <optgroup label="Course 1: Bob-omb Battlefield">

                                <option value="Find the 8 Red Coins">Find the 8 Red Coins</option>
                                <option value="Mario Wings to the Sky">Mario Wings to the Sky</option>
                                <option value="Behind Chain Chomp’s Gate">Behind Chain Chomp’s Gate</option>
                                <option value="Bob-omb Battlefield 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 2: Whomp’s Fortress">
                                <option value="Chip off Whomp’s Block">Chip off Whomp’s Block</option>
                                <option value="To the Top of the Fortress">To the Top of the Fortress</option>
                                <option value="Shoot into the Wild Blue">Shoot into the Wild Blue</option>
                                <option value="Red Coins on the Floating Isle">Red Coins on the Floating Isle</option>
                                <option value="Fall onto the Caged Island">Fall onto the Caged Island</option>
                                <option value="Blast Away the Wall">Blast Away the Wall</option>
                                <option value="Whomp’s Fortress 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 3: Jolly Roger Bay">
                                <option value="Plunder in the Sunken Ship">Plunder in the Sunken Ship</option>
                                <option value="Can the Eel Come out and Play?">Can the Eel Come out and Play?</option>
                                <option value="Treasure of the Ocean Cave">Treasure of the Ocean Cave</option>
                                <option value="Red Coins on the Ship Afloat">Red Coins on the Ship Afloat</option>
                                <option value="Blast to the Stone Pillar">Blast to the Stone Pillar</option>
                                <option value="Through the Jet Stream (JRB)">Through the Jet Stream</option>
                                <option value="Jolly Roger Bay 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 4: Cool, Cool Mountain">
                                <option value="Slip Slidin’ Away">Slip Slidin’ Away</option>
                                <option value="Li’l Penguin Lost">Li’l Penguin Lost</option>
                                <option value="Big Penguin Race">Big Penguin Race</option>
                                <option value="Frosty Slide for 8 Red Coins">Frosty Slide for 8 Red Coins</option>
                                <option value="Snowman’s Lost his Head">Snowman’s Lost his Head</option>
                                <option value="Wall Kicks will Work">Wall Kicks will Work</option>

                            </optgroup>

                                <option value="Go on a Ghost Hunt">Go on a Ghost Hunt</option>
                                <option value="Ride Big Boo’s Merry-Go-Round">Ride Big Boo’s Merry-Go-Round</option>
                                <option value="Secret of the Haunted Books">Secret of the Haunted Books</option>
                                <option value="Seek the 8 Red Coins">Seek the 8 Red Coins</option>
                                <option value="Big Boo’s Balcony">Big Boo’s Balcony</option>
                                <option value="Eye to Eye in the Secret Room">Eye to Eye in the Secret Room</option>
                                <option value="Big Boo’s Haunt 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 6: Hazy Maze Cave">

                                <option value="Elevate for 8 Red Coins">Elevate for 8 Red Coins</option>
                                <option value="Metal-Head Mario Can Move!">Metal-Head Mario Can Move!</option>
                                <option value="Navigating the Toxic Maze">Navigating the Toxic Maze</option>
                                <option value="A-Maze-ing Emergency Exit">A-Maze-ing Emergency Exit</option>
                                <option value="Watch for the Rolling Rocks">Watch for the Rolling Rocks</option>
                                <option value="Hazy Maze Cave 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 7: Lethal Lava Land">
                                <option value="Boil the Big Bully">Boil the Big Bully</option>
                                <option value="Bully the Bullies">Bully the Bullies</option>
                                <option value="8-Coin Puzzle with 15 Pieces">8-Coin Puzzle with 15 Pieces</option>
                                <option value="Red-Hot Log Rolling">Red-Hot Log Rolling</option>
                                <option value="Hot-Foot-It into the Volcano">Hot-Foot-It into the Volcano</option>
                                <option value="Elevator Tour in the Volcano">Elevator Tour in the Volcano</option>
                                <option value="Lethal Lava Land 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 8: Shifting Sand Land">
                                <option value="In the Talons of the Big Bird">In the Talons of the Big Bird</option>
                                <option value="Shining Atop the Pyramid">Shining Atop the Pyramid</option>
                                <option value="Inside the Ancient Pyramid">Inside the Ancient Pyramid</option>
                                <option value="Stand Tall on the Four Pillars">Stand Tall on the Four Pillars</option>
                                <option value="Free Flying for 8 Red Coins">Free Flying for 8 Red Coins</option>
                                <option value="Pyramid Puzzle">Pyramid Puzzle</option>
                                <option value="Shifting Sand Land 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 9: Dire, Dire Docks">
                                <option value="Board Bowser’s Sub">Board Bowser’s Sub</option>
                                <option value="Chests in the Current">Chests in the Current</option>
                                <option value="Pole-Jumping for Red Coins">Pole-Jumping for Red Coins</option>
                                <option value="Through the Jet Stream (DDD)">Through the Jet Stream</option>
                                <option value="The Manta Ray’s Reward">The Manta Ray’s Reward</option>
                                <option value="Collect the Caps">Collect the Caps</option>
                                <option value="Dire, Dire Docks 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 10: Snowman’s Land">
                                <option value="Snowman’s Big Head">Snowman’s Big Head</option>
                                <option value="Chill with the Bully">Chill with the Bully</option>
                                <option value="In the Deep Freeze">In the Deep Freeze</option>
                                <option value="Whirl from the Freezing Pond">Whirl from the Freezing Pond</option>
                                <option value="Shell Shreddin’ for 8 Red Coins">Shell Shreddin’ for 8 Red Coins</option>

                                <option value="Scary ‘Shrooms, Red Coins">Scary ‘Shrooms, Red Coins</option>

                                <option value="Breathtaking View from Bridge">Breathtaking View from Bridge</option>
                                <option value="Blast to the Lonely Mushroom">Blast to the Lonely Mushroom</option>
                                <option value="Tall, Tall Mountain 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 13: Tiny-Huge Island">
                                <option value="Pluck the Piranha Flower">Pluck the Piranha Flower</option>
                                <option value="The Tip Top of the Huge Island">The Tip Top of the Huge Island</option>
                                <option value="Rematch with Koopa the Quick">Rematch with Koopa the Quick</option>
                                <option value="Five Itty Bitty Secrets">Five Itty Bitty Secrets</option>
                                <option value="Wiggler’s Red Coins">Wiggler’s Red Coins</option>
                                <option value="Make Wiggler Squirm">Make Wiggler Squirm</option>
                                <option value="Tiny-Huge Island 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 14: Tick Tock Clock">
                                <option value="Roll into the Cage">Roll into the Cage</option>
                                <option value="The Pit and the Pendulums">The Pit and the Pendulums</option>
                                <option value="Get a Hand">Get a Hand</option>
                                <option value="Stomp on the Thwomp">Stomp on the Thwomp</option>
                                <option value="Timed Jumps on Moving Bars">Timed Jumps on Moving Bars</option>
                                <option value="Stop Time for Red Coins">Stop Time for Red Coins</option>
                                <option value="Tick Tock Clock 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Course 15: Rainbow Ride">
                                <option value="Cruiser Crossing the Rainbow">Cruiser Crossing the Rainbow</option>
                                <option value="The Big House in the Sky">The Big House in the Sky</option>
                                <option value="Coins Amassed in a Maze">Coins Amassed in a Maze</option>
                                <option value="Swingin’ in the Breeze">Swingin’ in the Breeze</option>
                                <option value="Tricky Triangles!">Tricky Triangles!</option>
                                <option value="Somewhere over the Rainbow">Somewhere over the Rainbow</option>
                                <option value="Rainbow Ride 100 Coins">100 Coins Star</option>
                            </optgroup>
                            <optgroup label="Peach’s Castle Secret Stars">
                                <option value="The Princess’s Secret Slide">The Princess’s Secret Slide</option>
                                <option value="The Princess’s Secret Slide 2">The Princess’s Secret Slide 2</option>
                                <option value="The Secret Aquarium">The Secret Aquarium</option>
                                <option value="Toad’s First Star">Toad’s First Star</option>
                                <option value="Toad’s Second Star">Toad’s Second Star</option>
                                <option value="Toad’s Third Star">Toad’s Third Star</option>
                                <option value="MIPS Bunny Chase">MIPS Bunny Chase</option>
                                <option value="MIPS Bunny Chase (Again)">MIPS Bunny Chase (Again)</option>
                                <option value="Tower of the Wing Cap">Tower of the Wing Cap</option>
                                <option value="Cavern of the Metal Cap">Cavern of the Metal Cap</option>
                                <option value="Vanish Cap Under the Moat">Vanish Cap Under the Moat</option>
                                <option value="Wing Mario Over the Rainbow">Wing Mario Over the Rainbow</option>
                                <option value="Bowser in the Dark World">Bowser in the Dark World</option>
                                <option value="Bowser in the Fire Sea">Bowser in the Fire Sea</option>
                                <option value="Bowser in the Sky">Bowser in the Sky</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Split Time (Seconds, e.g. 0.49 or 1.20)</label>
                        <input type="number" step="0.01" id="splitSeconds" placeholder="0.49" required />
                    </div>
                    <button type="submit">💾 Save Split & Recalculate</button>
                </form>
            </div>
        </div>

        <!-- Star Splits Breakdown by Level -->
        <div class="card">
            <h2>⭐ Segment & Level Breakdown (Detailed Splits)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Course / Level</th>
                        <th>Star #</th>
                        <th>Star Name</th>
                        <th>Best Split (s)</th>
                        <th>Last Updated</th>
                    </tr>
                </thead>
                <tbody id="splitsBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadLeaderboard() {
            const cat = document.getElementById('categorySelect').value;
            const res = await fetch(`/api/speedrun/leaderboard?category=${encodeURIComponent(cat)}`);
            const data = await res.json();
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = data.map(r => `
                <tr>
                    <td><strong>${r.runnerTag}</strong></td>
                    <td>${r.starsCompleted} ⭐</td>
                    <td class="time-badge">${r.totalRunTimeSeconds.toFixed(2)}s</td>
                    <td class="time-badge best-badge">${r.fastestStarSeconds.toFixed(2)}s</td>
                </tr>
            `).join('');
        }

        async function loadSplits() {
            const cat = document.getElementById('categorySelect').value;
            const tag = document.getElementById('runnerTag').value;
            const res = await fetch(`/api/speedrun/splits?runnerTag=${encodeURIComponent(tag)}&category=${encodeURIComponent(cat)}`);
            const data = await res.json();
            const tbody = document.getElementById('splitsBody');
            tbody.innerHTML = data.map(s => `
                <tr>
                    <td>C${s.courseNumber}: ${s.levelName}</td>
                    <td>Star ${s.starNumber}</td>
                    <td>${s.starName}</td>
                    <td class="time-badge best-badge">${s.bestTimeSeconds.toFixed(2)}s</td>
                    <td>${new Date(s.lastUpdated).toLocaleTimeString()}</td>
                </tr>
            `).join('');
        }

        async function handleUpdateTime(e) {
            e.preventDefault();
            const payload = {
                runnerTag: document.getElementById('runnerTag').value,
                starName: document.getElementById('starSelect').value,
                category: document.getElementById('categorySelect').value,
                timeSeconds: parseFloat(document.getElementById('splitSeconds').value)
            };

            await fetch('/api/speedrun/updatetime', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('splitSeconds').value = '';
            loadAllData();
        }

        function loadAllData() {
            loadLeaderboard();
            loadSplits();
        }

        loadAllData();
    </script>
</body>
</html>
